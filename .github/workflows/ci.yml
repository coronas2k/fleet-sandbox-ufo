# Sandbox CI. `ci-ok` is the one required check on main, as in the merge workflow under test.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm i -fg corepack@0.34.0 && corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm vitest run --typecheck

  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.test.result }}" = success
